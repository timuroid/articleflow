[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "articleflow-research"
version = "0.7.0"
description = "Research harness for loss-aware scientific DOCX templating"
requires-python = ">=3.11"
dependencies = ["lxml>=5", "python-docx>=1.1", "Pillow>=10", "PyMuPDF>=1.24", "numpy>=1.26", "httpx>=0.27", "jsonschema>=4.20"]

[project.optional-dependencies]
dev = ["behave==1.3.3"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.9,<1"]

[project.scripts]
articleflow = "articleflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
articleflow = ["web_static017/*.html", "web_static017/*.css", "web_static017/*.js"]
