name: Corpus integrity

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install DOCX renderer for integration tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer fontconfig fonts-liberation
          soffice --version
      - name: Install project
        run: python -m pip install -e '.[web,dev]'
      - name: Pin corpus generator dependencies
        run: python -m pip install python-docx==1.2.0 Pillow==12.3.0 lxml==6.1.1
      - name: Regenerate and verify DOCX corpus against committed manifest
        run: |
          cp datasets/synthetic-v1/manifest.json /tmp/articleflow-synthetic-v1-manifest.json
          python scripts/build_synthetic_corpus.py
          cmp /tmp/articleflow-synthetic-v1-manifest.json datasets/synthetic-v1/manifest.json
          python scripts/build_synthetic_corpus.py --verify
      - name: Run offline tests
        run: python -m unittest discover -s tests -q
      - name: Run implemented product scenarios
        run: behave docs/product/scenarios/research-pilot.feature docs/product/scenarios/structure-web.feature --format progress
      - name: Replay synthetic teacher/student results without API
        run: python scripts/replay_agent023.py --output artifacts/ci-replay023
